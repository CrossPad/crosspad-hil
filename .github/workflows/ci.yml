name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  packages: read   # pulls the CI image

# A push on top of a run still going supersedes it, as in platform-idf's build:
# one pull request (or main) holds one run. The bench machine runs one cell per
# runner, and three pushes in four minutes queued six 25-minute cells behind
# each other -- the last waited two hours for a result nobody wanted any more.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# CI image: ghcr.io/crosspad/crosspad-ci (tools/ci/Dockerfile in platform-idf),
# the same image -- and so the same cmake, ninja, compilers and Python -- for
# every CrossPad repository, on the bench machine (repository variable
# CI_RUNNER=self-hosted, tools/ci_runner.py in platform-idf) and on GitHub's
# runners alike. It is pinned here by tag and digest (GHCR lets a tag be
# moved, not a digest); moving to a new image revision is a commit like any
# other. Unset CI_RUNNER before the bench machine goes off:
# GitHub never falls back from a self-hosted label to a hosted runner.
# SECURITY: a self-hosted job container gets the host's Docker socket, so
# only a pull request whose branch lives in this repository may run there:
# runs-on sends every other one to GitHub's runners whatever CI_RUNNER says.
#
# Linux runs in the image (Python 3.12 is the system one, 3.10 a pinned
# standalone build; ALSA and PortAudio are there, so rtmidi and sounddevice
# really load). Windows runs in ci-windows.yml, after this one and optional:
# it uses GitHub-hosted minutes, and a run that cannot start must not turn
# this, the main check, red. The check names are still "test (<os>, <python>)".
jobs:
  test:
    name: test (ubuntu-latest, ${{ matrix.python }})
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && vars.CI_RUNNER || 'ubuntu-latest' }}
    container:
      image: ghcr.io/crosspad/crosspad-ci:v5.5.5-1@sha256:d89e2175ab2371eca90278a6a8774108b9387775344b2bbf837eabc2a30036bd
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      # This repository's own cache volume on the bench (pip wheels): one for
      # pushes to main, one for everything else (pull requests, manual runs,
      # other branches). A split, not a security boundary: a job on the bench
      # reaches the host's Docker through the socket the runner mounts. On a
      # hosted runner it starts empty.
      volumes:
        - crosspad-ci-cache-${{ github.event.repository.name }}-${{ github.ref == 'refs/heads/main' && 'trusted' || 'untrusted' }}:/cache
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12"]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      # A fresh venv from the image's interpreter; `python` and `pip` below
      # are the venv's (Ubuntu's own Python refuses system-wide pip installs).
      # In the container's own /tmp, not in $RUNNER_TEMP: that is the bench
      # machine's runner directory, where root-owned files outlive the job
      # (the runner cannot delete them) and both Python cells would share it.
      - name: Python ${{ matrix.python }}
        run: |
          "python${{ matrix.python }}" -m venv /tmp/venv
          echo "/tmp/venv/bin" >> "$GITHUB_PATH"
          echo "VIRTUAL_ENV=/tmp/venv" >> "$GITHUB_ENV"
      - name: Install
        run: python -m pip install -U pip && python -m pip install -e ".[dev,audio]"
      - name: Lint
        run: ruff check .
      - name: Test
        # Parallel: the suite is mostly waiting on fake ports, 24 min on one core.
        run: python -m pytest -n auto --dist worksteal
