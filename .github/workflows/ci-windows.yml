name: ci-windows

# Optional. The main check is ci (Linux, in the CI image); this one runs after
# it succeeds and never gates a merge. With the repository variable
# CI_WIN_RUNNER set it runs on a self-hosted Windows runner
# (crosspad-apps install/test/windows/winrunner.sh); unset, on GitHub-hosted
# Windows minutes, which a spending limit can stop: the jobs then do not start
# and only this workflow shows it.
on:
  workflow_run:
    workflows: [ci]
    types: [completed]
  workflow_dispatch:

# workflow_run runs with the base repository's token: keep it read-only and
# give the job no secrets -- it checks out and tests the commit ci tested.
permissions:
  contents: read

jobs:
  test-windows:
    # Only commits from this repository: a fork's pull request would run its
    # code here, in the base repository's context (pwn request).
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    name: test (windows, ${{ matrix.python }})
    runs-on: ${{ vars.CI_WIN_RUNNER || 'windows-latest' }}
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: python -m pip install -U pip && python -m pip install -e ".[dev,audio]"
      - name: Lint
        run: ruff check .
      - name: Test
        # Parallel: the suite is mostly waiting on fake ports, 24 min on one core.
        run: python -m pytest -n auto --dist worksteal
